# Recommendation-only VPAs (updateMode: Off). IBM operators own the Deployments:
# never set Auto / Recreate / Initial on these objects.
# Names assume instance mas1 / workspace ws1.
# Skip ibm-*-operator, entitymgr, and builds.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: mas-coreapi
  namespace: mas-mas1-core
  labels:
    app.kubernetes.io/part-of: mas-vpa-off
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mas1-coreapi
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        controlledValues: RequestsOnly
---
