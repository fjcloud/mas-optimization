---
# Create recommendation-only VPAs for whatever MAS instance/workspace is on
# the cluster. Names come from IBM labels and Suite CRs, not from mas1/ws1.
# Does not resize pods (updateMode: Off).
- name: Ensure Off-mode VPAs for MAS workloads
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    vpa_label: app.kubernetes.io/part-of=mas-vpa-off

  tasks:
    - name: List MAS deployments
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        label_selectors:
          - mas.ibm.com/instanceId
      register: mas_deploys

    - name: List Suites
      kubernetes.core.k8s_info:
        api_version: core.mas.ibm.com/v1
        kind: Suite
      register: suites
      failed_when: false

    - name: Build VPA targets from labels and Suite CRs
      ansible.builtin.set_fact:
        vpa_targets: "{{ lookup('template', 'vpa-targets.yaml.j2') | from_yaml }}"

    - name: Fail if nothing looks like MAS
      ansible.builtin.fail:
        msg: >-
          No MAS Deployments with label mas.ibm.com/instanceId.
          Install the Suite / ManageWorkspace first.
      when: vpa_targets | length == 0

    - name: Apply Off-mode VPA per workload
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('template', 'vpa-off.yaml.j2') }}"
      loop: "{{ vpa_targets }}"
      loop_control:
        loop_var: target
        label: "{{ target.namespace }}/{{ target.vpa_name }} -> {{ target.deploy }}"
