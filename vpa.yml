---
# Install Red Hat VPA (recommendation-only), create Off VPAs on MAS workloads,
# print recommendations, and write CR patches under output/. Does not apply patches.
- name: MAS VPA
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    deploy_dir: "{{ playbook_dir }}/deploy"
    instance_id: mas1
    workspace_id: ws1
    core_namespace: mas-{{ instance_id }}-core
    manage_namespace: mas-{{ instance_id }}-manage
    vpa_selector: app.kubernetes.io/part-of=mas-vpa-off
    output_dir: "{{ playbook_dir }}/output"

  tasks:
    - name: Apply operator namespace, OperatorGroup, and Subscription
      kubernetes.core.k8s:
        state: present
        src: "{{ deploy_dir }}/operator.yaml"

    - name: Wait for VerticalPodAutoscalerController CRD
      kubernetes.core.k8s_info:
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: verticalpodautoscalercontrollers.autoscaling.openshift.io
      register: vpac_crd
      until: vpac_crd.resources | default([]) | length > 0
      retries: 36
      delay: 10

    - name: Wait for VerticalPodAutoscaler CRD
      kubernetes.core.k8s_info:
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: verticalpodautoscalers.autoscaling.k8s.io
      register: vpa_crd
      until: vpa_crd.resources | default([]) | length > 0
      retries: 36
      delay: 10

    - name: Apply recommendation-only controller on workers
      kubernetes.core.k8s:
        state: present
        src: "{{ deploy_dir }}/controller.yaml"

    - name: List MAS deployments
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        label_selectors:
          - mas.ibm.com/instanceId
      register: mas_deploys

    - name: List Suites
      kubernetes.core.k8s_info:
        api_version: core.mas.ibm.com/v1
        kind: Suite
      register: suites
      failed_when: false

    - name: Build VPA targets from labels and Suite CRs
      ansible.builtin.set_fact:
        vpa_targets: "{{ lookup('template', 'vpa-targets.yaml.j2') | from_yaml }}"

    - name: Fail if nothing looks like MAS
      ansible.builtin.fail:
        msg: >-
          No MAS Deployments with label mas.ibm.com/instanceId.
          Install the Suite / ManageWorkspace first.
      when: vpa_targets | length == 0

    - name: Apply Off-mode VPA per workload
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('template', 'vpa-off.yaml.j2') }}"
      loop: "{{ vpa_targets }}"
      loop_control:
        loop_var: target
        label: "{{ target.namespace }}/{{ target.vpa_name }} -> {{ target.deploy }}"

    - name: List Off-mode VPAs
      kubernetes.core.k8s_info:
        api_version: autoscaling.k8s.io/v1
        kind: VerticalPodAutoscaler
        label_selectors:
          - "{{ vpa_selector }}"
      register: vpas

    - name: Fail if no Off VPAs
      ansible.builtin.fail:
        msg: No VPAs with label {{ vpa_selector }}.
      when: vpas.resources | length == 0

    - name: Get target workloads
      kubernetes.core.k8s_info:
        api_version: "{{ item.spec.targetRef.apiVersion | default('apps/v1') }}"
        kind: "{{ item.spec.targetRef.kind }}"
        name: "{{ item.spec.targetRef.name }}"
        namespace: "{{ item.metadata.namespace }}"
      loop: "{{ vpas.resources }}"
      loop_control:
        label: "{{ item.metadata.namespace }}/{{ item.spec.targetRef.kind }}/{{ item.spec.targetRef.name }}"
      register: workloads
      failed_when: false

    - name: Get Suite
      kubernetes.core.k8s_info:
        api_version: core.mas.ibm.com/v1
        kind: Suite
        name: "{{ instance_id }}"
        namespace: "{{ core_namespace }}"
      register: suite_cr

    - name: Get ManageWorkspace
      kubernetes.core.k8s_info:
        api_version: apps.mas.ibm.com/v1
        kind: ManageWorkspace
        name: "{{ instance_id }}-{{ workspace_id }}"
        namespace: "{{ manage_namespace }}"
      register: manage_cr

    - name: Build recommendation data
      ansible.builtin.set_fact:
        recs: "{{ lookup('template', 'recs.yaml.j2') | from_yaml }}"

    - name: Print recommendations
      ansible.builtin.debug:
        msg: "{{ lookup('template', 'recommendations.j2').splitlines() }}"

    - name: Reset output directory
      ansible.builtin.file:
        path: "{{ output_dir }}"
        state: "{{ item }}"
      loop:
        - absent
        - directory

    - name: Write ManageWorkspace merge patch
      ansible.builtin.template:
        src: patch-manage.yaml.j2
        dest: "{{ output_dir }}/manageworkspace-serverbundles.yaml"
      when: recs.manage.needed | bool

    - name: Write Suite JSON patch
      ansible.builtin.template:
        src: patch-suite.yaml.j2
        dest: "{{ output_dir }}/suite-podtemplates.yaml"
      when: recs.suite | length > 0

    - name: Print apply commands
      ansible.builtin.debug:
        msg: "{{ lookup('template', 'apply-commands.j2').splitlines() }}"
